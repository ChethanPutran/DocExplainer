[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-explainer-ui"
version = "1.0.0"
description = "Doc Explainer desktop UI (PySide6). Talks to the backend service through doc-explainer-sdk."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # The SDK is the only way this UI talks to the backend service
    "doc-explainer-sdk",
    "PySide6>=6.5.0",
    "PyMuPDF>=1.23.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    # Voice input / output
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "piper-tts>=1.3",
    "PyAudio>=0.2.11",
    "sounddevice>=0.4.6",
    "openai-whisper>=20231117",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-qt>=4.2.0"]

[project.scripts]
doc-explainer = "doc_explainer_ui.main:main"

[tool.uv.sources]
doc-explainer-sdk = { path = "../sdk", editable = true }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_explainer_ui = ["assets/**/*", "defaults/*.yaml"]
