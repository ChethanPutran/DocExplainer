[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-explainer"
version = "1.0.0"
description = "Intelligent Document Explanation System with AI-powered features"
readme = "README.md"
authors = [
    {name = "Doc Explainer Team", email = "team@docexplainer.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-core>=0.1.0",
    "langchain-google-genai>=0.0.5",
    "langchain-openai>=0.0.2",
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "python-pptx>=0.6.21",
    "python-docx>=0.8.11",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "graphviz>=0.20.1",
    "plotly>=5.17.0",
    "speechrecognition>=3.10.0",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.11",
    "sounddevice>=0.4.6",
    "whisper>=1.1.10",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
    "redis>=5.0.0",
    "diskcache>=5.6.0",
    "loguru>=0.7.0",
    "psutil>=5.9.0",
    "jsonlines>=4.0.0",
    "orjson>=3.9.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/doc-explainer"
"Bug Tracker" = "https://github.com/yourusername/doc-explainer/issues"
"Documentation" = "https://docs.docexplainer.com"

[project.scripts]
doc-explainer = "src.ui.gui.app:main"
doc-explainer-cli = "src.cli.main:main"

[project.gui-scripts]
doc-explainer-gui = "src.ui.gui.app:main"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests as GUI tests",
    "integration: marks tests as integration tests",
]