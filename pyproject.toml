[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "doc-explainer"
version = "1.0.0"
description = "Doc Explainer backend: document parsing, retrieval, knowledge graph and explanation engine (no GUI)"
readme = "ReadMe.md"
requires-python = ">=3.10"

authors = [
    { name = "Doc Explainer Team", email = "team@docexplainer.com" }
]

license = { text = "MIT" }

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]

dependencies = [
    # API service
    "fastapi>=0.110.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.9",        # FastAPI needs it for file uploads
    "pydantic>=2.0.0",
    # Language model providers (each wrapper in core/llm/wrappers; ollama uses requests)
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.2",        # openai and airouter
    "langchain-google-genai>=0.0.5",  # gemini
    "langchain-openrouter>=0.2.8",
    "requests>=2.31.0",
    # Document parsing
    "PyMuPDF>=1.24.3",                # pdf (imported as pymupdf)
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "beautifulsoup4>=4.12.0",         # html (with the lxml parser)
    "lxml>=4.9.0",
    "rapidocr-onnxruntime>=1.3.0",    # OCR for scanned PDF pages (optional at run time: without it they stay empty)
    # Embeddings and vector index
    "sentence-transformers>=2.2.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "chromadb>=0.4.0",
    # Configuration
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]


[project.optional-dependencies]
# What the test suites need
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27",                    # FastAPI's TestClient
]


[project.urls]
Homepage = "https://github.com/ChethanPutran/DocExplainer"
Repository = "https://github.com/ChethanPutran/DocExplainer"
"Bug Tracker" = "https://github.com/ChethanPutran/DocExplainer/issues"


[project.scripts]
doc-explainer-server = "doc_explainer.api.cli:main"

[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doc_explainer.config" = ["defaults/*.yaml"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests as GUI tests",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit._script"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]



# uv only (pip ignores this): use PyTorch's CPU build. The backend runs its small embedding model on the CPU, and the
# default Linux wheel would pull in several GB of CUDA libraries (and make the Docker image huge).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
