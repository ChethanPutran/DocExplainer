# Everything needed for development
all = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "prophet>=1.1.5",
    "imbalanced-learn>=0.11.0",
    "feature-engine>=1.6.0",
    "category-encoders>=2.6.3",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
    "pre-commit>=3.5.0",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "wheel>=0.41.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",
]


[project.urls]
Homepage = "https://github.com/ChethanPutran/DocExplainer"
Repository = "https://github.com/ChethanPutran/DocExplainer"
"Bug Tracker" = "https://github.com/ChethanPutran/DocExplainer/issues"


[project.scripts]
doc-explainer = "src.cli.main:main"
doc-explainer-cli = "src.cli.main:main"


[project.gui-scripts]
doc-explainer-gui = "src.ui.gui.app:main"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]


[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''


[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests as GUI tests",
    "integration: marks tests as integration tests",
]

