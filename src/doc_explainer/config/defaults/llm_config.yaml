# THE defaults for the language model. Do not copy this file: put only what you change in
# ~/.doc_explainer/config/llm_config.yaml, or set DOC_EXPLAINER_LLM_<KEY> (e.g. DOC_EXPLAINER_LLM_PROVIDER=openai).
# API keys are never written here: set AIROUTER_API_KEY / OPENROUTER_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY.
llm:
  provider: airouter          # one of the names under `providers`
  model: null                 # null = that provider's own default model (providers.<name>.model)
  base_url: null              # null = that provider's endpoint (providers.<name>.base_url)

  temperature: 1.0
  max_tokens: 8000            # reasoning models (ling-3.0-flash, kimi) think before answering and that counts: 1000 cut
                              # real section prompts off mid-answer (finish_reason=length -> empty/invalid JSON)
  timeout: null

  # An empty or cut-off answer is retried with a BIGGER budget (never the same one): max_tokens x growth, up to the cap.
  max_tokens_cap: 32000
  token_growth: 2.0
  token_retries: 2

  requests_per_minute: 10
  min_request_interval_seconds: null
  rate_limit_retries: 1

  reasoning: true
  ollama_base_url: "http://localhost:11434"

# What is specific to each provider. Add an entry to make a model or endpoint the default for it.
providers:
  airouter:                   # list the models your key can use: GET https://api.airouter.in/v1/models
    model: inclusionai/ling-3.0-flash
    base_url: https://api.airouter.in/v1
    api_key_env: AIROUTER_API_KEY
  openrouter:
    model: moonshotai/kimi-k3
    base_url: null            # the OpenRouter client has its own endpoint
    api_key_env: OPENROUTER_API_KEY
  openai:
    model: gpt-4o-mini
    base_url: null
    api_key_env: OPENAI_API_KEY
  gemini:
    model: gemini-3.5-flash
    base_url: null
    api_key_env: GEMINI_API_KEY
  ollama:
    model: "llama3.2:3b"
    base_url: null
    api_key_env: null
  local:
    model: local-extractive
    base_url: null
    api_key_env: null
